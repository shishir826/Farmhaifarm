<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | 🌱 FarmFresh</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="login.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>

  <body class="auth-page">
    <div class="auth-left">
      <div class="auth-overlay">
        <div class="auth-brand">🌱 FarmFresh</div>

        <div>
          <span>WELCOME BACK</span>
          <h1>Your Own<br />Farm<br />is waiting.</h1>
          <p>Discover Fresh Vegetable, Fruits directly from our Farmer.</p>
        </div>
      </div>
    </div>

    <div class="auth-right">
      <div class="auth-form">
        <a href="index.html" class="back-home">← Back to home</a>

        <h2>Welcome 👋</h2>
        <p class="auth-subtitle">Login to continue your healthy journey.</p>

        <form onsubmit="loginUser(event)">
          <label for="loginEmail">Email</label>
          <input
            type="email"
            id="loginEmail"
            name="email"
            autocomplete="email"
            placeholder="you@example.com"
            required
          />

          <label for="loginPassword">Password</label>
          <input
            type="password"
            id="loginPassword"
            name="password"
            autocomplete="current-password"
            placeholder="Enter your password"
            required
          />

          <div class="form-options">
            <label class="remember">
              <input type="checkbox" />
              Remember me
            </label>
            <a href="#">Forgot password?</a>
          </div>

          <button type="submit" class="main-auth-btn">Login →</button>
        </form>

        <div class="divider"><span>OR</span></div>

        <p class="register-text">
          Don't have an account?
          <a href="register.html">Create one</a>
        </p>
      </div>
    </div>

    <script>
      function loginUser(event) {
        event.preventDefault();

        const email = document.getElementById("loginEmail").value.trim();
        const password = document.getElementById("loginPassword").value;

        if (!email || !password) {
          alert("Please fill in all fields.");
        }
        return;
        // Put login information into FormData
        const formData = new FormData();

        formData.append("email", email);
        formData.append("password", password);

        // Send information to PHP
        fetch("php/login.php", {
          method: "POST",
          body: formData,
        })
          .then((response) => response.text())
          .then((data) => {
            if (data === "Login successful!") {
              alert("Login successful! 🎉");
              window.location.href = "index.html";
            } else {
              alert(data);
            }
          })
          .catch((error) => {
            console.error(error);
            alert("Something went wrong. Please try again.");
          });
      }
    </script>
  </body>
</html>
